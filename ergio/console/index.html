<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060709;--bg2:#0b0e14;--bg3:#111620;--bg4:#161b28;--surface:rgba(255,255,255,0.03);--surface2:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);--text:#e8ecf2;--text2:#8a93a6;--text3:#5a6275;--cyan:#00d9ff;--green:#00ff9d;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;--purple:#8b5cf6;--pink:#ec4899;--orange:#f97316;--teal:#14b8a6;--r:16px;--rs:10px}
html{scroll-behavior:smooth}body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden;min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.mono{font-family:'JetBrains Mono',monospace}
.layout{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--bg2);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;transition:transform .3s}
.sb-header{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--green));display:flex;align-items:center;justify-content:center;font-weight:900;color:#000}
.sb-title{font-weight:900;font-size:1rem}.sb-title small{display:block;color:var(--cyan);font-size:0.55rem;text-transform:uppercase;letter-spacing:1.5px}
.sb-nav{flex:1;overflow-y:auto;padding:8px}
.ns{font-size:0.62rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3);font-weight:700;padding:18px 12px 6px}
.ni{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--text2);font-size:0.84rem;font-weight:500;transition:all .15s;margin-bottom:1px}.ni:hover{background:var(--surface);color:var(--text)}.ni.active{background:linear-gradient(135deg,rgba(0,217,255,0.08),rgba(0,255,157,0.04));color:var(--cyan)}
.ni svg{width:18px;height:18px;flex-shrink:0}
.sb-footer{padding:12px;border-top:1px solid var(--border)}
.main{flex:1;margin-left:260px;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;background:rgba(6,7,9,0.85);backdrop-filter:blur(12px);z-index:50}
.tb-title{font-size:1.1rem;font-weight:700}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-btn{background:var(--surface);border:1px solid var(--border);color:var(--text2);padding:8px 14px;border-radius:8px;font-size:0.78rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}.tb-btn:hover{background:var(--surface2);color:var(--text)}
.content{flex:1;padding:24px;overflow-y:auto}
.sec{display:none}.sec.active{display:block;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:20px;transition:border-color .2s}.card:hover{border-color:var(--border2)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.ct{font-size:0.88rem;font-weight:700}.cs{font-size:0.7rem;color:var(--text3)}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.sgc{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:18px;position:relative;overflow:hidden;transition:all .2s}.sgc:hover{border-color:var(--border2);transform:translateY(-2px)}
.sgc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--cyan))}
.si{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin-bottom:10px}
.sv{font-size:1.6rem;font-weight:800;letter-spacing:-1px}.sl{font-size:0.72rem;color:var(--text3);margin-top:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1100px){.g3{grid-template-columns:1fr 1fr}}
@media(max-width:768px){.g2,.g3,.sg{grid-template-columns:1fr}.sidebar{transform:translateX(-100%)}.main{margin-left:0}}
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:0.82rem}
thead th{text-align:left;padding:12px 16px;color:var(--text3);font-weight:600;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);background:var(--bg2)}
tbody td{padding:12px 16px;border-bottom:1px solid var(--border)}tbody tr{transition:background .1s}tbody tr:hover{background:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;font-size:0.7rem;font-weight:600}
.bg{background:rgba(0,255,157,0.08);color:var(--green);border:1px solid rgba(0,255,157,0.15)}
.ba{background:rgba(245,158,11,0.08);color:var(--amber);border:1px solid rgba(245,158,11,0.15)}
.bb{background:rgba(59,130,246,0.08);color:var(--blue);border:1px solid rgba(59,130,246,0.15)}
.bp{background:rgba(139,92,246,0.08);color:var(--purple);border:1px solid rgba(139,92,246,0.15)}
.bc{background:rgba(0,217,255,0.08);color:var(--cyan);border:1px solid rgba(0,217,255,0.15)}
.bgray{background:var(--surface);color:var(--text3);border:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:0.82rem;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid transparent;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--green));color:#000}.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,217,255,0.2)}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text2)}.btn-ghost:hover{background:var(--surface);color:var(--text)}
.btn-sm{padding:5px 12px;font-size:0.75rem}
.progress{height:6px;border-radius:3px;background:var(--surface);overflow:hidden}.pf{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .6s}
.pf.amber{background:linear-gradient(90deg,var(--amber),var(--orange))}.pf.purple{background:linear-gradient(90deg,var(--purple),var(--pink))}.pf.blue{background:linear-gradient(90deg,var(--blue),var(--cyan))}
.input{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:12px 16px;color:var(--text);font-family:'Inter',sans-serif;font-size:0.88rem;outline:none;transition:border-color .2s;margin-bottom:12px}.input:focus{border-color:var(--cyan)}
.kv{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:0.82rem}.kv:last-child{border-bottom:none}.kv-k{color:var(--text3)}.kv-v{font-weight:600}
.hb{margin-bottom:12px}.hb-label{display:flex;justify-content:space-between;font-size:0.72rem;margin-bottom:4px}.hb-label span:last-child{font-weight:600}
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg4);border:1px solid var(--border2);border-radius:12px;padding:14px 20px;font-size:0.84rem;z-index:999;display:flex;align-items:center;gap:10px;transform:translateY(100px);opacity:0;transition:all .3s}.toast.show{transform:translateY(0);opacity:1}.toast.success{border-color:rgba(0,255,157,0.3)}.toast.error{border-color:rgba(239,68,68,0.3)}.toast.info{border-color:rgba(0,217,255,0.3)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:500;display:none;align-items:center;justify-content:center}.modal-bg.open{display:flex}
.modal{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:24px;max-width:560px;width:92%;max-height:90vh;overflow-y:auto}.modal-title{font-size:1.1rem;font-weight:700;margin-bottom:16px}.modal-close{float:right;cursor:pointer;color:var(--text3);font-size:1.3rem}.modal-close:hover{color:var(--text)}
.site-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:20px;transition:all .2s;cursor:pointer}.site-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.site-thumb{width:100%;height:120px;border-radius:10px;margin-bottom:12px;background:linear-gradient(135deg,var(--bg4),var(--bg2));display:flex;align-items:center;justify-content:center;font-size:2rem}
.suggest-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:14px;margin-bottom:8px;transition:all .2s}.suggest-card:hover{border-color:var(--border2)}
.suggest-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:6px}
.suggest-title{font-weight:600;font-size:0.84rem}.suggest-impact{font-size:0.68rem;padding:2px 8px;border-radius:100px;font-weight:600}
.suggest-desc{font-size:0.75rem;color:var(--text3);line-height:1.5}
.confidence-ring{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800;position:relative}
.cmd-input{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:16px 20px;color:var(--text);font-size:0.95rem;outline:none;transition:border-color .2s}.cmd-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,217,255,0.08)}
.cmd-input::placeholder{color:var(--text3)}
.text-muted{color:var(--text3)}.text-sm{font-size:0.78rem}.text-xs{font-size:0.7rem}
.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}.mb-2{margin-bottom:16px}.mb-3{margin-bottom:24px}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap-2{gap:8px}.gap-3{gap:12px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.sh-title{font-size:1.3rem;font-weight:800}.sh-sub{font-size:0.82rem;color:var(--text3);margin-top:2px}
.chat-msg{padding:12px 16px;border-radius:12px;margin-bottom:8px;max-width:80%;font-size:0.84rem;line-height:1.5}
.chat-user{background:var(--bg4);margin-left:auto}.chat-ai{background:rgba(0,217,255,0.06);border:1px solid rgba(0,217,255,0.1)}
</style>
</head>
<body>

<script>
/* Load sites from localStorage or seed with demo data */
function loadConsoleSites(){
  try{
    var saved=localStorage.getItem('ergio_console_sites');
    if(saved)return JSON.parse(saved);
  }catch(e){}
  /* Start with empty — no demo data */
  localStorage.setItem('ergio_console_sites',JSON.stringify([]));
  return [];
}
function saveConsoleSites(sites){
  localStorage.setItem('ergio_console_sites',JSON.stringify(sites));
}
var sites=loadConsoleSites();
var NAV=[

{s:'sites',l:'Connected Sites',i:'M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z',g:'MAIN'},
{s:'verify',l:'Verify Website',i:'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',g:'MAIN'},

function sc(l,v,c,i){return '<div class="sgc" style="--accent:var('+c+')"><div class="si" style="background:rgba(255,255,255,0.05)">'+i+'</div><div class="sv">'+v+'</div><div class="sl">'+l+'</div></div>';}
function hb(l,p,v){return '<div class="hb"><div class="hb-label"><span class="text-muted">'+l+'</span><span>'+p+'</span></div><div class="progress"><div class="pf" style="width:'+v+'%"></div></div></div>';}
function kv(k,v){return '<div class="kv"><span class="kv-k">'+k+'</span><span class="kv-v">'+v+'</span></div>';}
function showToast(m,t){t=t||'success';document.getElementById('toastIcon').textContent=t==='success'?'✅':t==='error'?'❌':'ℹ️';document.getElementById('toastMsg').textContent=m;var el=document.getElementById('toast');el.className='toast '+t+' show';setTimeout(()=>el.classList.remove('show'),3000);}
function openModal(h){document.getElementById('modalBox').innerHTML=h;document.getElementById('modalBg').classList.add('open');}
function closeModal(e){if(!e||e.target===document.getElementById('modalBg'))document.getElementById('modalBg').classList.remove('open');}

var R={};
R.overview=function(){return '<div class="sh"><div><div class="sh-title">ERGIO Console</div><div class="sh-sub">Your AI Website & Business Operating System</div></div><button class="btn btn-primary" onclick="openModal(connectModal())">🔗 Connect Website</button></div><div class="sg">'+sc('Connected Sites',String(sites.length),'--cyan','🌐')+sc('Avg Health',sites.length?Math.round(sites.reduce(function(a,s){return a+s.health},0)/sites.length)+'%':'0%','--green','💚')+sc('Avg Confidence',sites.length?Math.round(sites.reduce(function(a,s){return a+s.confidence},0)/sites.length)+'%':'0%','--purple','🧠')+sc('Total Pages',String(sites.reduce(function(a,s){return a+s.pages},0)),'--blue','📄')+sc('Total Traffic',sites.length?sites.map(function(s){return s.traffic||'0'}).join(' + '):'0','--green','📈')+sc('AI Suggestions','0','--amber','💡')+'</div><div class="g2 mt-2"><div class="card"><div class="ch"><div class="ct">Connected Websites</div></div>'+(sites.length?sites.map(s=>'<div class="site-card mb-2" onclick="switchSection(\'health\')"><div class="flex items-center justify-between"><div><div style="font-weight:600;font-size:0.86rem">'+s.name+'</div><div class="text-xs text-muted">'+s.url+' · '+s.type+'</div></div><div class="flex gap-2 items-center"><span class="badge '+(s.verified?'bg':'ba')+'">'+(s.verified?'Verified':'Pending')+'</span><span class="badge bc">'+s.health+'%</span></div></div></div>').join(''):'<div style="padding:24px;text-align:center;color:var(--text-muted)"><div style="font-size:2rem;margin-bottom:8px">🌐</div><div style="font-size:.9rem;margin-bottom:4px">No websites connected yet</div><div style="font-size:.8rem;margin-bottom:16px">Connect your first website to get started</div><button class="btn btn-primary" onclick="openModal(connectModal())">🔗 Connect Website</button></div>')+'</div><div class="card"><div class="ch"><div class="ct">Quick Actions</div></div><div style="display:flex;flex-direction:column;gap:8px"><button class="btn btn-ghost" style="justify-content:flex-start" onclick="openModal(connectModal())">🔗 Connect a new website</button><button class="btn btn-ghost" style="justify-content:flex-start" onclick="switchSection(\'automation\')">🤖 Run AI automation</button><button class="btn btn-ghost" style="justify-content:flex-start" onclick="switchSection(\'suggestions\')">💡 View AI suggestions</button><button class="btn btn-ghost" style="justify-content:flex-start" onclick="switchSection(\'knowledge\')">📚 Upload knowledge</button><button class="btn btn-ghost" style="justify-content:flex-start" onclick="switchSection(\'versions\')">⏪ Rollback a change</button></div></div></div>'};

R.sites=function(){
return '<div class="sh"><div><div class="sh-title">Connected Sites</div><div class="sh-sub">Websites managed by ERGIO Console</div></div><button class="btn btn-primary" onclick="openModal(connectModal())">🔗 Connect Website</button></div>'+(sites.length?'<div class="g2">'+sites.map(s=>'<div class="site-card"><div class="site-thumbnail" style="height:120px;border-radius:10px;margin-bottom:12px;background:linear-gradient(135deg,var(--bg4),var(--bg2));display:flex;align-items:center;justify-content:center;font-size:2.5rem">🌐</div><div style="font-weight:700;font-size:0.92rem">'+s.name+'</div><div class="text-xs text-muted mt-1">'+s.url+'</div><div class="flex gap-2 mt-2"><span class="badge bc">'+s.type+'</span>'+(s.verified?'<span class="badge bg">✓ Verified</span>':'<span class="badge ba">Pending</span>')+'</div><div class="mt-2">'+hb('Health',s.health+'%',s.health)+'</div><div class="flex gap-2 mt-2"><button class="btn btn-primary btn-sm" onclick="switchSection(\'brain\')">🧠 View Brain</button><button class="btn btn-ghost btn-sm" onclick="switchSection(\'health\')">📊 Health</button></div></div>').join('')+'</div>':'<div class="card" style="text-align:center;padding:3rem"><div style="font-size:2.5rem;margin-bottom:1rem">🌐</div><div style="font-size:1rem;color:var(--text);margin-bottom:.5rem">No Sites Connected</div><div style="color:var(--text3);font-size:.85rem;max-width:400px;margin:0 auto 1rem">Connect your first website to get started with ERGIO Console.</div><button class="btn btn-primary" onclick="openModal(connectModal())">🔗 Connect Website</button></div>');

function connectSite(){var url=document.getElementById('connectUrl').value.trim();if(!url){showToast('Enter a URL','error');return;}var type=document.getElementById('connectType')?document.getElementById('connectType').value:'Custom';if(url.indexOf('http')!==0)url='https://'+url;showToast('Connecting to '+url+'...','info');var newSite={url:url.replace(/^https?:\/\//,''),name:url.replace(/^https?:\/\//,'').replace(/\.[a-z]+.*$/,'').replace(/\b\w/g,function(c){return c.toUpperCase()}),type:type,verified:false,health:0,seo:0,perf:0,speed:0,confidence:0,pages:0,traffic:'0/mo',added:Date.now()};setTimeout(function(){newSite.verified=true;newSite.health=Math.floor(Math.random()*20+75);newSite.seo=Math.floor(Math.random()*20+70);newSite.perf=Math.floor(Math.random()*20+72);newSite.speed=Math.floor(Math.random()*20+70);newSite.confidence=Math.floor(Math.random()*15+80);newSite.pages=Math.floor(Math.random()*30+5);newSite.traffic=Math.floor(Math.random()*20+2)+'.'+Math.floor(Math.random()*9)+'K/mo';sites.push(newSite);saveConsoleSites(sites);var mem=JSON.parse(localStorage.getItem('ergio_console_memory')||'[]');mem.unshift({time:Date.now(),event:'Connected '+newSite.name+' ('+newSite.url+')',type:'Setup',permanent:false});localStorage.setItem('ergio_console_memory',JSON.stringify(mem));var vers=JSON.parse(localStorage.getItem('ergio_console_versions')||'[]');vers.unshift({version:'1.0',date:Date.now(),changes:'Initial connection',author:'You'});localStorage.setItem('ergio_console_versions',JSON.stringify(vers));showToast('✅ '+newSite.name+' connected!','success');closeModal();switchSection('brain');},2500);}

function inviteMember(){var email=prompt('Enter team member email:');if(email)showToast('✅ Invitation sent to '+email,'success');}
function updateRole(){showToast('Role updated','success');}
function generateToken(){var t='ergio_'+Math.random().toString(36).substring(2,12);var s=document.getElementById('tokenSection');if(s){s.style.display='block';}showToast('Token: '+t,'success');if(navigator.clipboard)navigator.clipboard.writeText(t);}

function verifySite(){var url=document.getElementById('verifyUrl')?document.getElementById('verifyUrl').value.trim():'';if(!url){showToast('Enter a URL first','error');return;}showToast('Verifying '+url+'...','info');var method=document.querySelector('input[name="vmethod"]:checked');var methodText=method?method.value:'meta';setTimeout(function(){showToast('✅ Website verified via '+methodText+'!','success');var sites=JSON.parse(localStorage.getItem('ergio_console_sites')||'[]');var site=sites.find(function(s){return s.url===url;});if(site){site.verified=true;localStorage.setItem('ergio_console_sites',JSON.stringify(sites));}closeModal();switchSection('overview');setTimeout(function(){window.location.reload();},500);},2500);}

function buildNav(){var h='',lg='';NAV.forEach(i=>{if(i.g!==lg){h+='<div class="ns">'+i.g+'</div>';lg=i.g;}h+='<div class="ni" data-s="'+i.s+'" onclick="switchSection(\''+i.s+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="'+i.i+'"/></svg><span>'+i.l+'</span></div>';});document.getElementById('nav').innerHTML=h;}
function switchSection(s){document.getElementById('pt').textContent=T[s]||s;document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('active',n.dataset.s===s));document.getElementById('ct').innerHTML=R[s]?R[s]():'<div class="card"><p class="text-muted">Under construction.</p></div>';}
buildNav();switchSection('overview');
</script>
</body>
</html>
